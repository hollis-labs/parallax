# Source proposal only. Register and deploy after operator approval.
kind: cerberus-project/v1
owner: parallax
namespace: local

project:
  id: parallax
  name: Parallax
  description: Fixture-only GUI laboratory with an embedded frontend.

resources:
  - id: parallax-uat
    name: Parallax UAT
    project: parallax
    type: process
    connector: local
    tags: [uat, gui, go, artifact]
    config:
      dir: .
      build_strategy:
        kind: make_standard
        source:
          root: .
        rules:
          target: build
          output: .scratch/parallax
      command: ["./.scratch/parallax"]
      mode: os_service
      supervisor: auto
      run_from: artifact
      install_after_build: false
      auto_start: false
      auto_restart: true
      restart_delay: 2s
      port: 18441
      url: http://127.0.0.1:18441/
      # Placeholders: the operator supplies real absolute paths at registration. The file named by
      # SUBSTRATE_CONFIG holds httphost.addr ("127.0.0.1:18441"); the data directory holds the
      # identity database and signing key (private, owned by the service user).
      env:
        SUBSTRATE_CONFIG: /srv/example/parallax/substrate.yaml
        PARALLAX_DATA_DIR: /srv/example/parallax/data
      health_check:
        url: http://127.0.0.1:18441/healthz
        timeout: 5s
        interval: 30s
