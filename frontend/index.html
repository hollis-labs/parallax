<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parallax</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23333'/%3E%3Cpath d='M4 12V4h4a2.5 2.5 0 010 5H4' fill='none' stroke='%23fff' stroke-width='1.6'/%3E%3C/svg%3E" />
    <script>
      // Set the persisted theme attribute synchronously, before first paint
      // and before the deferred module script runs — otherwise the page
      // paints with no data-theme attribute (default light styling) and
      // flips to the stored theme a moment later, which reads as a flash.
      // Mirrors @hollis-labs/kit-dashboard's applyTheme/getInitialTheme.
      (() => {
        const KEY = "sysop.theme";
        const KNOWN = ["p1-green-phosphor", "p3-amber-phosphor", "p4-white", "hi-contrast"];
        let theme = "p4-white";
        try {
          const stored = window.localStorage.getItem(KEY);
          if (stored && KNOWN.indexOf(stored) !== -1) theme = stored;
        } catch {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
